name: orange

on:
  schedule:
    - cron: "0 */24 * * *"
  push:
    branches:
      - main
      - master
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make scripts executable
        run: chmod +x ./gradlew ./compileDebug ./compileRelease

      - name: Compile Debug
        run: ./compileDebug

      - name: Compile Release
        run: ./compileRelease

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Validate extension package
        run: |
          test -n "$(find output -maxdepth 1 -type f -name '*.xed' -print -quit)"
          unzip -l output/*.xed
          unzip -p output/*.xed manifest.json | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["id"] == "io.github.orange.universal"; assert d["mainClass"] == "io.github.orange.universal.Main"; print("Manifest OK:", d["name"], d["version"])'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: universal-language-manager
          path: output/*.xed
